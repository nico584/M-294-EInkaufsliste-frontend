<h2 mat-dialog-title>Artikel {{ data.item.id ? 'bearbeiten' : 'hinzufügen' }}</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input #name matInput formControlName="name" maxlength="255" required />
      <mat-hint align="end">{{ name.value.length }}/255</mat-hint>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Notiz</mat-label>
      <input #note matInput formControlName="note" maxlength="500" />
      <mat-hint align="end">{{ note.value.length }}/500</mat-hint>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Menge</mat-label>
      <input matInput formControlName="quantity" type="number" min="1" required />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Kategorie</mat-label>
      <mat-select formControlName="category" [compareWith]="compareCategories">
        <mat-option [value]="null">Keine Kategorie</mat-option>
        @for (category of categories; track category.id) {
          <mat-option [value]="category">{{ category.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</div>

<mat-dialog-actions align="end">
  <button (click)="onCancel()" mat-button>Abbrechen</button>
  <button (click)="onSave()" [disabled]="!form.valid" color="primary" mat-raised-button>Speichern</button>
</mat-dialog-actions>

<div class="page-header">
  <h2>Meine Einkaufslisten</h2>
  <button (click)="add()" mat-raised-button color="primary">
    <mat-icon>add</mat-icon>
    Liste erstellen
  </button>
</div>

@if (lists.length === 0) {
  <p class="empty-hint">Es sind noch keine Einkaufslisten vorhanden.</p>
}

<div class="list-grid">
  @for (list of lists; track list.id) {
    <mat-card class="list-card" (click)="open(list)">
      <mat-card-header>
        <mat-card-title>{{ list.name }}</mat-card-title>
        <mat-card-subtitle>{{ list.items.length }} Artikel</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ list.description }}</p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button (click)="edit(list, $event)" mat-icon-button color="primary">
          <mat-icon>edit</mat-icon>
        </button>
        <button (click)="delete(list, $event)" mat-icon-button color="warn">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  }
</div>

<h2>Mein Profil</h2>

@if (user) {
  <mat-card class="profile-card">
    <mat-card-content>
      <div class="profile-row"><mat-icon>person</mat-icon> {{ user.firstName }} {{ user.lastName }}</div>
      <div class="profile-row"><mat-icon>alternate_email</mat-icon> {{ user.username }}</div>
    </mat-card-content>
  </mat-card>
}
